; LilyGO T-SIM7670G-S3-Standard (ESP32-S3-WROOM-1-N16R2 + SIM7670G modem)
; A copy of examples/A7670ETest for the S3 board. The old A7670E boards keep using that sketch,
; so changes here never reach them.
;   Build and flash:  pio run -d s3/S3Firmware -e T-SIM7670G-S3 -t upload
;   Provision once:   pio run -d s3/S3Firmware -e T-SIM7670G-S3-provision -t upload  (never publish it)
[platformio]
boards_dir = boards
lib_dir = ../../lib

[env:T-SIM7670G-S3]
platform = espressif32
framework = arduino
board = esp32-s3-wroom-1-n16r2   ; 16 MB flash, 2 MB PSRAM, two 3 MB OTA slots
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
build_flags =
	-DLILYGO_SIM7670G_S3_STAN
	-DTINY_GSM_MODEM_SIM7672
lib_deps =
	milesburton/DallasTemperature@^3.11.0
	h2zero/NimBLE-Arduino@^2.3.0

; Same firmware, but writes the secrets from src/secrets.h to NVS. Never publish this build for OTA.
[env:T-SIM7670G-S3-provision]
extends = env:T-SIM7670G-S3
build_flags = ${env:T-SIM7670G-S3.build_flags}
	-DPROVISION_SECRETS

; Wiring test: reads the MAX6675 once a second forever (no modem) for a logic analyzer. Flash the normal env afterwards.
[env:T-SIM7670G-S3-max6675test]
extends = env:T-SIM7670G-S3
build_flags = ${env:T-SIM7670G-S3.build_flags}
	-DMAX6675_TEST_LOOP
