; Seeed XIAO nRF52840 BLE sender (water/shed temperature)
; Uses the community nRF52 platform, which has the Seeed non-mbed (Adafruit based) core
[env:xiao]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
