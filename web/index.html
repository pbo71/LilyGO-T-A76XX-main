<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Målinger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav>
    <a href="index.html" class="active">Test-board</a>
    <a href="soen.html">Søen</a>
  </nav>
  <h1 id="title">Målinger</h1>
  <p class="sub" id="updated">Henter data …</p>

  <div class="cards" id="cards"></div>

  <div class="ranges" id="ranges">
    <button data-range="24h" class="active">Døgn</button>
    <button data-range="7d">Uge</button>
    <button data-range="30d">Måned</button>
    <button data-range="1y">År</button>
  </div>

  <div id="charts"></div>
  <footer id="footer"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// Test board (A7670ETest firmware with the Bluetooth sensor in fields 6-8)
const PAGE = {
  channel: 2695386,
  fields: {
    field2: { name: 'Udetemperatur', unit: '°C', digits: 1 },
    field3: { name: 'Indendørs temperatur', unit: '°C', digits: 0 },
    field6: { name: 'BT temperatur', unit: '°C', digits: 1 },
    field4: { name: 'Batteri', unit: 'V', digits: 2, scale: 0.001 },
    field7: { name: 'BT batteri', unit: 'V', digits: 2, scale: 0.001 },
    field5: { name: 'Batterifald pr. døgn', unit: 'mV', digits: 0, daily: true },
    field8: { name: 'BT signal', unit: 'dBm', digits: 0 },
  },
  charts: [
    { title: 'Temperatur', fields: ['field3', 'field6', 'field2'], unit: '°C' },
    { title: 'Batteri', fields: ['field4', 'field7'], unit: 'V', minSpan: 0.1 },
    { title: 'Bluetooth-signal', fields: ['field8'], unit: 'dBm' },
  ],
};
</script>
<script src="app.js"></script>
</body>
</html>
